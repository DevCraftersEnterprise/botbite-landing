<header
  class="fixed inset-x-0 top-0 z-50 transition-[background-color,box-shadow,border-color] duration-300"
  [class]="
    scrolled() || isOpen()
      ? 'border-b border-neutral-200/70 bg-white/80 shadow-[0_1px_0_rgb(0_0_0/0.02)] backdrop-blur-xl'
      : 'border-b border-transparent bg-transparent'
  "
>
  <nav class="container-page flex h-16 items-center justify-between" aria-label="Principal">
    <a
      routerLink="/home"
      fragment="inicio"
      (click)="go($event, 'inicio')"
      class="group flex items-center gap-2.5 rounded-lg"
      aria-label="BotBite, ir al inicio"
    >
      <img
        src="assets/botbite-mark.png"
        alt=""
        width="32"
        height="32"
        class="size-8 transition-transform duration-300 group-hover:-rotate-6"
      />
      <span class="text-[17px] tracking-tight text-neutral-950">
        <span class="font-light">BOT</span><span class="font-extrabold">BITE</span>
      </span>
    </a>

    <ul class="hidden items-center gap-1 lg:flex">
      @for (link of links; track link.id) {
        <li>
          <a
            routerLink="/home"
            [fragment]="link.id"
            (click)="go($event, link.id)"
            class="rounded-lg px-3 py-2 text-sm font-medium text-neutral-600 transition-colors hover:bg-neutral-100 hover:text-neutral-950"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <div class="hidden items-center gap-2 lg:flex">
      <a
        [href]="site.appLoginUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-neutral-700 transition-colors hover:bg-neutral-100 hover:text-neutral-950"
      >
        <lucide-icon [img]="icons.LogIn" [size]="16" />
        Acceder
      </a>
      <a
        routerLink="/home"
        fragment="contacto"
        (click)="go($event, 'contacto')"
        class="btn-primary group !px-4 !py-2"
      >
        Solicitar demo
        <lucide-icon
          [img]="icons.ArrowRight"
          [size]="16"
          class="transition-transform group-hover:translate-x-0.5"
        />
      </a>
    </div>

    <button
      type="button"
      class="inline-flex size-10 items-center justify-center rounded-lg text-neutral-900 transition-colors hover:bg-neutral-100 lg:hidden"
      [attr.aria-expanded]="isOpen()"
      aria-controls="menu-movil"
      [attr.aria-label]="isOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="toggle()"
    >
      <lucide-icon [img]="isOpen() ? icons.X : icons.Menu" [size]="22" />
    </button>
  </nav>

  @if (isOpen()) {
    <div id="menu-movil" class="animate-slide-in-top border-t border-neutral-200/70 lg:hidden">
      <ul class="container-page flex flex-col gap-1 py-4">
        @for (link of links; track link.id) {
          <li>
            <a
              routerLink="/home"
              [fragment]="link.id"
              (click)="go($event, link.id)"
              class="block rounded-lg px-3 py-3 text-base font-medium text-neutral-800 hover:bg-neutral-100"
            >
              {{ link.label }}
            </a>
          </li>
        }
        <li class="mt-3 grid grid-cols-2 gap-2">
          <a
            [href]="site.appLoginUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="btn-secondary"
            (click)="close()"
          >
            <lucide-icon [img]="icons.LogIn" [size]="16" />
            Acceder
          </a>
          <a
            routerLink="/home"
            fragment="contacto"
            (click)="go($event, 'contacto')"
            class="btn-primary"
          >
            Solicitar demo
          </a>
        </li>
      </ul>
    </div>
  }
</header>
