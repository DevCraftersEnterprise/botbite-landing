<section id="seguridad" class="section" aria-labelledby="seguridad-title">
  <div class="container-page grid gap-14 lg:grid-cols-[0.9fr_1.1fr] lg:items-start">
    <div class="lg:sticky lg:top-28">
      <app-section-heading
        align="left"
        eyebrow="Seguridad"
        headingId="seguridad-title"
        title="Pedidos reales, de mesas reales"
        description="Abrir un canal de pedidos no debería abrir la puerta a bromas ni a accesos indebidos. BotBite está diseñado para que solo pida quien está en tu restaurante."
      />
      <div appReveal [revealDelay]="180" class="mt-8 hidden lg:block">
        <span class="inline-flex size-20 items-center justify-center rounded-3xl bg-neutral-950 text-white shadow-(--shadow-lift)">
          <lucide-icon [img]="icons.ShieldCheck" [size]="36" [strokeWidth]="1.5" />
        </span>
      </div>
    </div>

    <ul class="grid gap-4 sm:grid-cols-2">
      @for (item of items; track item.title; let i = $index) {
        <li appReveal [revealDelay]="(i % 2) * 90" class="card group p-6 transition-all duration-300 hover:-translate-y-1 hover:shadow-(--shadow-lift)">
          <span class="icon-tile transition-colors duration-300 group-hover:bg-emerald-50 group-hover:text-emerald-700 group-hover:border-emerald-200">
            <lucide-icon [img]="item.icon" [size]="20" />
          </span>
          <h3 class="mt-5 font-semibold tracking-tight text-neutral-950">{{ item.title }}</h3>
          <p class="mt-2 text-[15px] leading-relaxed text-neutral-600">{{ item.text }}</p>
        </li>
      }
    </ul>
  </div>
</section>
