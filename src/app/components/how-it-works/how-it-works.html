<section id="como-funciona" class="section border-t border-neutral-200/70 bg-(--color-surface)" aria-labelledby="como-funciona-title">
  <div class="container-page">
    <app-section-heading
      eyebrow="Cómo funciona"
      headingId="como-funciona-title"
      title="Del QR al pedido en caja, en cuatro pasos"
      description="Tus clientes usan la app que ya tienen abierta todo el día. Tú recibes pedidos claros, por escrito y sin intermediarios."
    />

    <div class="relative mt-16">
      <!-- Línea conectora (escritorio) -->
      <div
        aria-hidden="true"
        class="absolute top-[34px] right-[12%] left-[12%] hidden h-px bg-gradient-to-r from-transparent via-neutral-300 to-transparent lg:block"
      ></div>

      <ol class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (step of steps; track step.title; let i = $index) {
        <li appReveal [revealDelay]="i * 100" class="group relative">
          <div class="card h-full p-6 transition-all duration-300 hover:-translate-y-1 hover:shadow-(--shadow-lift)">
            <div class="flex items-center justify-between">
              <span
                class="relative z-10 flex size-11 items-center justify-center rounded-xl bg-neutral-950 text-white transition-transform duration-300 group-hover:scale-105"
              >
                <lucide-icon [img]="step.icon" [size]="20" />
              </span>
              <span class="font-mono text-sm font-medium text-neutral-400">0{{ i + 1 }}</span>
            </div>
            <h3 class="mt-6 text-lg font-semibold tracking-tight text-neutral-950">{{ step.title }}</h3>
            <p class="mt-2 text-[15px] leading-relaxed text-neutral-600">{{ step.text }}</p>
          </div>
        </li>
      }
      </ol>
    </div>
  </div>
</section>
